services:
  # ===================================================
  # 1. MongoDB Database Service
  # ===================================================
  mongodb:
    image: mongo:7.0
    container_name: techhub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - techhub_network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================================================
  # 2. Backend REST API Service (Node.js / Express)
  # ===================================================
  backend:
    build:
      context: ./nodejs-user-api
      dockerfile: Dockerfile
    container_name: techhub_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/techhub_db
      - JWT_ACCESS_SECRET=techhub_access_token_super_secret_key_2025
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=techhub_refresh_token_super_secret_key_2025
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - techhub_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===================================================
  # 3. Frontend Web App Service (React / Vite + Nginx)
  # ===================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techhub_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - techhub_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  techhub_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
